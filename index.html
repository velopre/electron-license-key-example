<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App License Activation</title>
<style>
  body { margin: 0; padding: 32px; background: #0f1115; color: #e6e8ee; font: 15px system-ui, sans-serif; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  input, button { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 8px; font-size: 15px; }
  input { border: 1px solid #2b303b; background: #181b22; color: inherit; margin-bottom: 12px; }
  button { border: 0; background: #4f7cff; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #badge { display: inline-block; margin-top: 20px; padding: 6px 12px; border-radius: 999px; font-size: 13px; background: #3a2226; color: #ff8a8a; }
  #badge.ok { background: #1d3426; color: #7be0a0; }
  #msg { margin-top: 14px; color: #9aa1b2; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
  <h1>App License Activation</h1>
  <input id="key" placeholder="License key" autocomplete="off" spellcheck="false">
  <button id="go">Activate License</button>
  <div id="badge">Unlicensed</div>
  <div id="msg"></div>
<script>
  const $ = (id) => document.getElementById(id);

  function show(s) {
    const ok = s.state !== 'unlicensed';
    $('badge').className = ok ? 'ok' : '';
    $('badge').textContent = s.state === 'valid' ? 'License Valid'
      : s.state === 'offline' ? `Offline Lease (Expires in ${s.days} days)`
      : 'Unlicensed';
    $('msg').textContent = s.error || s.note || '';
  }

  $('go').onclick = async () => {
    $('go').disabled = true;
    show(await window.license.activate($('key').value));
    $('go').disabled = false;
  };

  window.license.status().then(show);   // startup: offline cached-lease check
</script>
</body>
</html>
